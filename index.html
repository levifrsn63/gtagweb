<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unity WebGL Player</title>
    <style>
        body {
            display: flex;
            margin: 0;
            height: 100vh;
        }
        #sidebar {
            width: 250px;
            background-color: #f4f4f4;
            padding: 20px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            overflow-y: auto;
        }
        #gameContainer {
            flex-grow: 1;
            position: relative;
        }
        canvas {
            width: 100%;
            height: 100%;
        }
    </style>
    <script src="gtagweb/gtagweb.loader.js"></script>
</head>
<body>
    <div id="sidebar">
        <h2>Game Options</h2>
        <ul>
            <li><button onclick="startGame()">Start Game</button></li>
            <li><button onclick="pauseGame()">Pause Game</button></li>
            <li><button onclick="restartGame()">Restart Game</button></li>
        </ul>
    </div>
    <div id="gameContainer">
        <!-- The Unity WebGL player will be loaded here -->
        <script type="text/javascript">
            var Module = {
                // Unity configuration settings
                dataUrl: 'gtagweb/gtagweb.data.unityweb',
                frameworkUrl: 'gtagweb/gtagweb.framework.js.unityweb',
                codeUrl: 'gtagweb/gtagweb.wasm.unityweb',
                // Other settings can go here
            };
        </script>
    </div>
</body>
</html>
